aid: rocksalt
name: Rocksalt
description: >-
  Rocksalt is a B2B inbound and social-engagement platform, headquartered in
  Redwood City, California and founded in 2023 by Arjun Moorthy (CEO), Anita
  Moorthy (CMO), and Ajoy Sojan (CTO). The product helps founders, executives,
  and subject-matter experts build visibility and win business on LinkedIn and
  Reddit in roughly ten minutes a day: an AI-powered digest surfaces the
  industry conversations worth joining, suggests personalized comments grounded
  in the user's expertise, assists with post creation, and adds team
  collaboration workflows plus analytics and HubSpot CRM sync. Rocksalt raised
  seed funding from Lightspeed Venture Partners in 2025. It is a marketing SaaS
  application delivered through a web app rather than a public developer API;
  this profile was surfaced from the Lightspeed portfolio and enriched with
  the company's public identity and web properties.
